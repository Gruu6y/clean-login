<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Login</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--magpie-bg, Canvas);
      color: var(--magpie-fg, CanvasText);
      font: 14px/1.6 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    }
    main { max-width: 440px; text-align: center; }
    strong { display: block; margin-bottom: 4px; font-size: 15px; }
    p { margin: 0; color: var(--magpie-muted, GrayText); }
    button {
      margin-top: 14px;
      padding: 5px 16px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--magpie-border, color-mix(in srgb, currentColor 24%, transparent));
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: color-mix(in srgb, currentColor 7%, transparent); }
  </style>
</head>
<body>
  <main>
    <strong id="title">Clean Login</strong>
    <p id="status">Connecting to the local service…</p>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
